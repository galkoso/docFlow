name: Backend
on: [push, pull_request]
jobs:
  domain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: specspace
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: specspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specspace"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://specspace:ci-only@localhost:5432/specspace
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo run --quiet -p specspace-api --bin export-openapi > /tmp/specspace-openapi.json
      - run: diff -u ../docs/openapi.json /tmp/specspace-openapi.json
      - run: cargo run --quiet -p specspace-document-engine --example editor_contract > /tmp/specspace-editor-contract.json
      - run: diff -u ../fixtures/editor-contract.json /tmp/specspace-editor-contract.json
