[package]
name = "specspace-api"
default-run = "specspace-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
postgres-tests = []

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
specspace-infrastructure = { path = "../infrastructure" }
specspace-application = { path = "../application" }
specspace-git-adapter = { path = "../git-adapter" }
specspace-document-engine = { path = "../document-engine", features = ["openapi"] }
base64 = "0.22"
sha2 = "0.10"
cookie = "0.18"
url = "2"
utoipa = { version = "6", features = ["uuid"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
specspace-domain = { path = "../domain" }

[[test]]
name = "auth_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "book_postgres"
required-features = ["postgres-tests"]

[lints]
workspace = true
