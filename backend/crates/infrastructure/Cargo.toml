[package]
name = "specspace-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
postgres-tests = []

[dependencies]
sqlx.workspace = true
uuid.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
specspace-application = { path = "../application" }
async-trait = "0.1"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2.6"
openidconnect = "4.1"
specspace-git-adapter = { path = "../git-adapter" }
specspace-document-engine = { path = "../document-engine" }
specspace-domain = { path = "../domain" }
zeroize = "1"

[dev-dependencies]
tracing-subscriber.workspace = true
axum.workspace = true
base64 = "0.22"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }

[[test]]
name = "postgres"
required-features = ["postgres-tests"]

[[test]]
name = "search_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "proposals_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "saves_postgres"
required-features = ["postgres-tests"]

[lints]
workspace = true
