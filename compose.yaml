name: specspace-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: specspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: specspace
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U specspace -d specspace']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
