[package]
name = "specspace-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
openapi = ["dep:utoipa", "specspace-document-engine/openapi"]

[dependencies]
specspace-domain = { path = "../domain" }
specspace-document-engine = { path = "../document-engine" }
specspace-git-adapter = { path = "../git-adapter" }
async-trait = "0.1"
tokio.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
url = "2"
utoipa = { version = "6", features = ["uuid"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
